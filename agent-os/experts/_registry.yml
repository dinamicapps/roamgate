# Registro de Expertos -- Agent OS
#
# DOS tipos de expertos:
#
# tipo: "especializado"
#   Participan cuando el usuario los activa (sugeridos automaticamente o invocados manualmente).
#   Estructura BMAD: SKILL.md + references/ -- se invocan como skills completos.
#   momento: pre-discovery | post-discovery
#   (puede invocarse en otras etapas via condicion HALT en work.md)
#
# tipo: "calidad"
#   Participan SIEMPRE de forma automatica en los gates.
#   Estructura BMAD: SKILL.md + references/ -- se invocan con capacidad especifica.
#   No requieren activacion por el usuario.
#
# AUTORIDAD DE DESTILACION (capacidad DT):
#   Varios expertos declaran DT. Quien tiene la ultima palabra sobre el CONTENIDO
#   de un standard cuando dos expertos chocan se define en
#   agent-os/skills/destilar-standard/SKILL.md, en la seccion de autoridad y
#   resolucion de conflictos (tabla por dominio + protocolo de 3 pasos). NO duplicar aqui.
#
# ---------------------------------------------------------------------------
# SENALES POR MODO (senales_por_modo)
# ---------------------------------------------------------------------------
# Cada experto declara sus senales agrupadas por modo del work.
# Modos soportados: normal | investigacion | documentacion | hotfix (evolucion deprecado -> ruta rediseno-ui)
#
# Semantica por modo (valida para todos los expertos):
#
#   normal          -> senales que INVITAN al experto al analisis (pre-discovery
#                      o post-discovery segun 'momento'). Rol de invitado.
#
#   evolucion (deprecado -> ruta rediseno-ui) -> legacy: senales que antes
#                      proponian activar modo:evolucion (deprecado). Se conservan
#                      para works historicos; Sally asumia invitada en E1/E2/E4 LE/VE.
#
#   investigacion   -> senales que proponen al usuario activar modo:investigacion.
#                      Cuando se confirma, el experto asume el rol_por_modo
#                      declarado (tipicamente Mary como anfitriona de E3).
#
#   documentacion   -> senales que proponen al usuario activar modo:documentacion.
#                      Cuando se confirma, el experto asume el rol_por_modo
#                      declarado (tipicamente Paige como anfitriona de E2-E3).
#
# Un experto puede no tener entradas para un modo -> no participa en ese modo.
#
# ROL POR MODO (rol_por_modo)
# Cada experto declara que rol juega en cada modo:
#
#   invitada-pre-discovery   invitada al analisis durante el abordaje, antes de definir
#                            alcance (no hay Etapa 0/1 en modo normal; el abordaje la reemplazo)
#   invitada-post-discovery  invitada al analisis despues de discovery
#   anfitriona-E1 .. E4      conduce la etapa N con prefijo A-{experto}
#   invitada-E1 .. E4        invitada a la etapa N por el anfitrion
#   anfitrion-E3-pool        host de E3 que coordina el pool de ejecutores+invitables;
#                            autoridad de coordinacion pero last-word por dominio (Amelia=codigo,
#                            Atlas=cross-lens, Sentinel=seguridad). Contrato en
#                            agent-os/skills/host-protocol/etapas/etapa-3.md. NO duplicar aqui.
#
# ---------------------------------------------------------------------------
# SENALES POR CODEBASE (senales_codebase)
# ---------------------------------------------------------------------------
# Independientes del modo. Invitan al experto cuando el patron matchea.
#   tipo: "grep"         -> busca patron en contenido de archivos
#   tipo: "glob"         -> busca archivos por patron de ruta
#   tipo: "ausencia"     -> se activa si NO hay archivos en el area mencionada
#   tipo: "escalamiento" -> se activa si el abordaje escalo el analisis a nivel Profundo
#
# CAMPO RETIRADO: `genera:` (los 10 de la seccion expertos). Nombraba un archivo
# por experto (experto-{nombre}-analisis.md) que la politica de archivos
# consolidados de 2026-04-30 elimino. Tenia cero consumidores. Los `genera:` de la
# seccion `calidad:` son otra cosa (artefactos de gate vivos) y siguen vigentes.

