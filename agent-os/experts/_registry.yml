gobernador:

  alfred:
    nombre: "Alfred"
    rol: "Gobernador del flujo de trabajo"
    rol_bmad: "bmad-agent-alfred"
    archivo: "agent-os/experts/bmad-agent-alfred/SKILL.md"
    descripcion_corta: "Conduce el flujo de trabajo de agent-os: abordaje -> ruta -> piezas. Activa a los expertos en cada pieza; no participa en gates como invitado. Reemplaza progresivamente al motor `/work` (legacy, en retiro). Incorpora la lente analitica de principios de diseno al proponer rutas de codigo."
    comando: "/alfred"
    rutas: [responder, bugfix, acotado, diseno, rediseno-ui, investigacion, documentacion, hotfix]
    no_participa_en_gates: true
    convive_con: "/work (legacy, en retiro)"
