        afecta: ENT_vinculo_tab_archivos
        enunciado: El vinculo se persiste en localStorage por conexion (clave filesTabLinks) indexado por ownerTabId; al cargar o en cada snapshot vigente se conserva solo si el ownerTabId sigue vivo en tab.list, si no se descarta (INV-09). El id virtual del tab se deriva como files:{ownerTabId} y no se persiste
