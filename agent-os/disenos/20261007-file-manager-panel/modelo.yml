        resultado: al volver se ven la misma ruta, la misma seleccion y el mismo preview
    - id: ESC_P2_ver_cambios
      tipo: escenario
      estado: resuelto
      etapa: modelado
      campos:
        accion: en el preview de un archivo modificado pulsar 'Ver cambios'
        precondicion: tab de archivos activo con un archivo modificado seleccionado
        receta_dato_prueba: Herdr corriendo; workspace demo con checkout git (repo con src/ y un archivo modificado sin commitear); al menos dos consolas en el workspace
        resultado: el Inspector se abre en Changes al costado con ese archivo; el tab de archivos sigue en el centro
    - id: ESC_P3_orden_y_atajos
      tipo: escenario
      estado: resuelto
      etapa: modelado
      campos:
        accion: pulsar Ctrl+2 y despues arrastrar '2 web' a la primera posicion
        precondicion: '''2 web'' con su tab de archivos abierto'
        receta_dato_prueba: Herdr corriendo; workspace demo con checkout git (repo con src/ y un archivo modificado sin commitear); al menos dos consolas en el workspace
        resultado: Ctrl+2 activa la consola '2 web' (no el tab de archivos); al arrastrar, el tab de archivos se mueve pegado a su consola y ningun tab de Herdr salta al indice 0
    - id: ESC_P3_foco_externo_shared
      tipo: escenario
      estado: resuelto
      etapa: modelado
      campos:
        accion: desde la TUI de Herdr enfocar '1 api'
        precondicion: modo shared, tab de archivos de '2 web' activo en el navegador
        receta_dato_prueba: Herdr corriendo; workspace demo con checkout git (repo con src/ y un archivo modificado sin commitear); al menos dos consolas en el workspace; navegacion shared; tener la TUI de Herdr abierta
        resultado: el navegador muestra '1 api'; el tab de archivos de '2 web' sigue en el strip y se vuelve a el con un clic
    - id: ESC_P3_mobile_nav
      tipo: escenario
      estado: resuelto
      etapa: modelado
      campos:
        accion: en layout mobile pulsar Files y luego Terminal en la nav
        precondicion: layout mobile, una sola consola
        receta_dato_prueba: Herdr corriendo; workspace demo con checkout git (repo con src/ y un archivo modificado sin commitear); al menos dos consolas en el workspace; forzar ?layout=mobile y dejar una sola consola
        resultado: Files muestra su tab de archivos y Terminal vuelve a la consola; el strip sigue oculto y MobileTabSheet no lista el tab de archivos
    - id: ESC_P4_cierre_externo
      tipo: escenario
      estado: resuelto
      etapa: modelado
      campos:
        accion: cerrar la consola '2 web' desde la TUI de Herdr
        precondicion: '''2 web'' con su tab de archivos abierto en el navegador'
        receta_dato_prueba: Herdr corriendo; workspace demo con checkout git (repo con src/ y un archivo modificado sin commitear); al menos dos consolas en el workspace; tener la TUI de Herdr abierta
        resultado: tras el refresh siguiente el tab de archivos de '2 web' desaparece junto con su vinculo y sus pestanas
    - id: ESC_P4_ctrl_alt_w
      tipo: escenario
      estado: resuelto
      etapa: modelado
      campos:
        accion: con el tab de archivos de '2 web' activo pulsar Ctrl+Alt+W
        precondicion: tab de archivos de '2 web' activo
        receta_dato_prueba: Herdr corriendo; workspace demo con checkout git (repo con src/ y un archivo modificado sin commitear); al menos dos consolas en el workspace
        resultado: se cierra solo el tab de archivos y se muestra '2 web'; ninguna consola se cierra
    - id: ESC_P4_esc_cascada
      tipo: escenario
      estado: resuelto
      etapa: modelado
      campos:
        accion: con la busqueda del explorador abierta pulsar Esc dos veces; despues, en la consola dentro de vim, pulsar Esc
        precondicion: tab de archivos activo con la busqueda abierta
        receta_dato_prueba: Herdr corriendo; workspace demo con checkout git (repo con src/ y un archivo modificado sin commitear); al menos dos consolas en el workspace; abrir vim en la consola
        resultado: el primer Esc cierra la busqueda, el segundo vuelve a la consola sin cerrar el tab; el Esc dentro de vim no afecta al tab de archivos
    - id: ESC_P4_recarga_y_reinicio
      tipo: escenario
      estado: resuelto
      etapa: modelado
      campos:
        accion: recargar el navegador; despues reiniciar Herdr de modo que los tab_id cambien y recargar
        precondicion: '''2 web'' con su tab de archivos y pestanas abiertas'
        receta_dato_prueba: Herdr corriendo; workspace demo con checkout git (repo con src/ y un archivo modificado sin commitear); al menos dos consolas en el workspace
        resultado: tras recargar se restaura el tab de archivos; tras reiniciar Herdr con ids nuevos los vinculos se descartan y no aparecen tabs de archivos huerfanos
    - id: ESC_P5_saneo_view_files
      tipo: escenario
      estado: resuelto
      etapa: modelado
      campos:
        accion: abrir el Inspector
        precondicion: preferencias guardadas con view files (escribir en localStorage la clave workspaceInspector:{owner} con view files)
        receta_dato_prueba: Herdr corriendo; workspace demo con checkout git (repo con src/ y un archivo modificado sin commitear); al menos dos consolas en el workspace; antes de abrir, guardar en localStorage las preferencias con view files
        resultado: el Inspector abre en Changes y no intenta mostrar Files
    - id: ESC_P5_worktree_files
      tipo: escenario
      estado: resuelto
      etapa: modelado
      campos:
        accion: en el ciclo de vida de worktrees pulsar Files de una fila
        precondicion: workspace con worktree listado
        receta_dato_prueba: Herdr corriendo; workspace demo con checkout git (repo con src/ y un archivo modificado sin commitear); al menos dos consolas en el workspace; crear un worktree adicional
        resultado: se abre o enfoca el tab de archivos de la consola activa de ese workspace; el Inspector no se abre
    - id: ESC_P5_toggle_sin_files
      tipo: escenario
      estado: resuelto
      etapa: modelado
      campos:
        accion: usar inspector.toggle
        precondicion: Inspector cerrado
        receta_dato_prueba: Herdr corriendo; workspace demo con checkout git (repo con src/ y un archivo modificado sin commitear); al menos dos consolas en el workspace
        resultado: el Inspector abre con solo Changes, Commits e History en su lista de vistas
    - id: DEC_R1_link_pane_dueno
      tipo: decision
      estado: resuelto
      etapa: procesos
      campos:
        afecta: PRO_P1_abrir_enfocar
        enunciado: Un link de archivo emitido por un pane abre o enfoca el tab de archivos de la consola duena de ese pane, aunque no sea la activa
        que_resolvio: alternativa elegida
        razon: el paneId de origen ya viaja en el evento; usar la consola activa abriria los archivos de otra consola
    - id: DEC_R2_drag_hover_strip
      tipo: decision
      estado: resuelto
      etapa: procesos
      campos:
        afecta: PRO_P3_navegar_strip
        enunciado: Arrastrar una ruta desde el tab de archivos y mantenerla sobre el tab de una consola en el strip activa esa consola para soltar la ruta en su terminal
        que_resolvio: alternativa elegida
        razon: conserva el gesto actual de arrastrar rutas a la terminal sin restar espacio a la consola
    - id: DEC_R3_files_toggle_real
      tipo: decision
      estado: resuelto
      etapa: procesos
      campos:
        afecta: PRO_P1_abrir_enfocar
        enunciado: 'files.toggle (Ctrl+Alt+E) es un toggle: si el tab de archivos de la consola activa esta visible vuelve a la consola; si no, lo abre o lo enfoca'
        que_resolvio: alternativa elegida
        razon: conserva el significado de toggle del atajo actual
    - id: REG_link_resuelve_pane_dueno
      tipo: regla
      estado: resuelto
      etapa: procesos
      campos:
        enunciado: Una entrada desde un link de terminal resuelve ownerTabId desde el paneId de origen (pane -> tab_id) y no desde la consola activa
        origen: nueva
    - id: REG_drop_hover_activa_consola
      tipo: regla
      estado: resuelto
      etapa: procesos
      campos:
        enunciado: Durante un arrastre de ruta, mantener el puntero sobre el tab de una consola en el strip la activa para permitir soltar en su terminal; el tab de archivos de origen no se cierra
        origen: nueva
    - id: REG_files_toggle
      tipo: regla
      estado: resuelto
      etapa: procesos
      campos:
        enunciado: files.toggle con el tab de archivos de la consola activa visible vuelve a la consola; en cualquier otro estado ejecuta abrir o enfocar
        origen: nueva
    - id: REG_anotaciones_conservadas
      tipo: regla
      estado: resuelto
      etapa: procesos
      campos:
        enunciado: La extraccion N1 conserva las dependencias de anotaciones del preview (lectura, creacion, reanclaje y suspension al cambiar de pestana) y su scope; AnnotationComposerPopover y AnnotationPanel siguen funcionando desde el tab de archivos
        origen: nueva
    - id: REG_merge_por_owner
      tipo: regla
      estado: resuelto
      etapa: procesos
      campos:
        enunciado: 'Escribir filesTabLinks es lectura-merge-escritura por ownerTabId: una pestana del navegador solo agrega o modifica la entrada de su consola; las bajas solo ocurren por cierre del tab o de su consola o por reconciliacion con el snapshot'
        origen: nueva
    - id: REG_barrera_primer_snapshot
      tipo: regla
      estado: resuelto
      etapa: procesos
      campos:
        enunciado: Hasta recibir el primer snapshot vigente de la conexion y generacion, los vinculos persistidos no se muestran ni se eliminan
        origen: nueva
    - id: REG_cuota_y_barrido
      tipo: regla
      estado: resuelto
      etapa: procesos
      campos:
        enunciado: Cada vinculo guarda como maximo 20 pestanas de archivo (se descartan las mas antiguas); una escritura que falla por QuotaExceededError no rompe la UI y se reintenta tras podar; al reconciliar se barren las claves filesTabFiles:{ownerTabId} sin vinculo
        origen: nueva
    - id: ESC_P1_link_consola_no_activa
      tipo: escenario
      estado: resuelto
      etapa: modelado
      campos:
        accion: en la consola '1 api' (no activa, con dos panes) pulsar un link de archivo emitido por su segundo pane
        precondicion: consola activa '2 web'; '1 api' con dos panes
        receta_dato_prueba: Herdr corriendo; workspace demo con checkout git (repo con src/ y un archivo modificado sin commitear); al menos dos consolas en el workspace; dividir '1 api' en dos panes y hacer que el segundo imprima una ruta de archivo
        resultado: se activa '1 api' y se abre o enfoca su tab de archivos con el archivo del link; no se abre el de '2 web'
    - id: ESC_P1_files_toggle_doble
      tipo: escenario
      estado: resuelto
      etapa: modelado
      campos:
        accion: pulsar Ctrl+Alt+E dos veces seguidas
        precondicion: consola '2 web' activa
        receta_dato_prueba: Herdr corriendo; workspace demo con checkout git (repo con src/ y un archivo modificado sin commitear); al menos dos consolas en el workspace
        resultado: la primera vez aparece su tab de archivos, la segunda vuelve a '2 web'
    - id: ESC_P1_dos_pestanas_navegador
      tipo: escenario
      estado: resuelto
      etapa: modelado
      campos:
        accion: en dos pestanas del navegador abrir a la vez el tab de archivos de '1 api' en una y de '2 web' en la otra
        precondicion: dos pestanas del navegador con la misma conexion
        receta_dato_prueba: Herdr corriendo; workspace demo con checkout git (repo con src/ y un archivo modificado sin commitear); al menos dos consolas en el workspace; abrir Roamgate en dos pestanas del navegador
        resultado: ambos vinculos quedan en filesTabLinks; ninguna pestana borra el de la otra
    - id: ESC_P2_anotacion_sobrevive
      tipo: escenario
      estado: resuelto
      etapa: modelado
      campos:
        accion: en el preview de un archivo crear una anotacion, cambiar a otra consola, volver y abrir el panel de anotaciones
        precondicion: tab de archivos con un archivo abierto
        receta_dato_prueba: Herdr corriendo; workspace demo con checkout git (repo con src/ y un archivo modificado sin commitear); al menos dos consolas en el workspace
        resultado: la anotacion existe, se ve en el panel y el preview la muestra al volver
    - id: ESC_P3_drag_ruta_a_terminal
      tipo: escenario
      estado: resuelto
      etapa: modelado
      campos:
        accion: arrastrar App.tsx desde el arbol y mantenerlo sobre el tab '2 web' del strip; soltar en la terminal
        precondicion: tab de archivos de '2 web' activo
        receta_dato_prueba: Herdr corriendo; workspace demo con checkout git (repo con src/ y un archivo modificado sin commitear); al menos dos consolas en el workspace
        resultado: se activa '2 web' y la ruta se inserta en su terminal; el tab de archivos sigue en el strip
    - id: ESC_P4_snapshot_retrasado
      tipo: escenario
      estado: resuelto
      etapa: modelado
      campos:
        accion: recargar el navegador con la red lenta
        precondicion: vinculos persistidos de '1 api' y '2 web'
        receta_dato_prueba: Herdr corriendo; workspace demo con checkout git (repo con src/ y un archivo modificado sin commitear); al menos dos consolas en el workspace; throttling de red en devtools antes de recargar
        resultado: mientras no llega el primer snapshot no se muestran ni se borran tabs de archivos; al llegar se restauran los vivos
    - id: ESC_P4_barrido_huerfanos
      tipo: escenario
      estado: resuelto
      etapa: modelado
      campos:
        accion: recargar tras dejar en localStorage una clave filesTabFiles de una consola inexistente
        precondicion: clave filesTabFiles:{id inexistente} escrita a mano
        receta_dato_prueba: Herdr corriendo; workspace demo con checkout git (repo con src/ y un archivo modificado sin commitear); al menos dos consolas en el workspace; escribir en localStorage una clave filesTabFiles con un ownerTabId que Herdr no lista
        resultado: tras la reconciliacion la clave huerfana se elimina
